packages:
  - "packages/*"
  - "coding/keymaster/p2p-host"

linkWorkspacePackages: true

allowBuilds:
  esbuild: true

overrides:
  "@aws-sdk/xml-builder": 3.972.19
  bitcoin-libp2p: 0.3.2

minimumReleaseAgeExclude:
  - keymaster-connect@0.1.4
  - bitcoin-libp2p@0.3.2
  - bsv8-channel-protocol@0.5.0 || 0.6.0
  - keymaster-hold@0.1.0
  - keyhold@2.1.0
  - sat-subscription-protocol@0.3.0
  - bitfs-protocol@0.6.0
  - webloom-framework@0.6.0
  - keymaster-trade-scheduler@0.3.0
  - keymaster-utxo-manager@0.3.0
  - keymaster-utxo-manager@0.5.0
  - keymaster-utxo-manager@0.6.0
  - keymaster-utxo-manager@0.7.0

# CI 的 pnpm 11.5.1 在冻结锁文件校验时不应用 minimumReleaseAgeExclude；
# 新发布的 keymaster-connect@0.1.5 会被 24h 发布年龄策略阻断，故关闭该检查。
minimumReleaseAge: 0
