name: Contract checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract-checks:
    name: contract-checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check out download scheduler
        run: git clone --depth 1 https://github.com/bsv8/keymaster.cc-download-scheduler.git ../keymaster.cc-download-scheduler
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run type, contract and source checks
        run: pnpm check:types
